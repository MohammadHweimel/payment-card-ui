<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-image: url(images/visacard1.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        .ADDCARD {
            color: white;
            background-color: #00ae4b;
        }

        .outline-label {
            font-size: clamp(10px, 2.5vw, 11px);
            line-height: 1;
        }
    </style>

</head>

<body class="d-flex align-items-center ">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-6" style="max-width: 540px;">
                <div class="card text-center rounded-3">
                    <div class="text-container">
                        <h2 class="fw-bold mt-5">Settings</h2>
                        <span>Payment</span>
                    </div>

                    <div class="text-start p-3 p-md-5">
                        <h6 class="fw-bold mb-3">Saved Card:</h6>

                        <div class="d-flex align-items-center gap-2 mb-3">
                            <i class="fa-brands fa-cc-mastercard fs-1"></i>
                            <div class="position-relative flex-grow-1">
                                <input type="text" class="form-control py-2" id="savedCard1"
                                    value="**** **** **** 3193 " readonly>
                                <label for="savedCard1"
                                    class="outline-label position-absolute top-0 start-0 translate-middle-y bg-white px-1 ms-3 text-muted">Card
                                    Number</label>
                            </div>
                            <a href="" class="small text-decoration-none text-nowrap fw-bold "
                                style="color: #6f42c1">Remove card</a>
                        </div>

                        <div class="d-flex align-items-center gap-2 ">
                            <i class="fa-brands fa-cc-visa fs-1"></i>
                            <div class="position-relative flex-grow-1">
                                <input type="text" class="form-control py-2" id="savedCard2" value="**** **** **** 4296"
                                    readonly>
                                <label for="savedCard2"
                                    class="outline-label position-absolute top-0 start-0 translate-middle-y bg-white px-1 ms-3 text-muted">Card
                                    Number</label>
                            </div>
                            <a href="" class="small text-decoration-none text-nowrap fw-bold "
                                style="color: #6f42c1">Remove card</a>
                        </div>

                        <div>
                            <h6 class="fw-bold mt-4 mb-3">Add new card:</h6>

                            <div class="position-relative">
                                <input type="text" class="form-control py-2" id="cardName"
                                    placeholder="Mohammad hweimel">
                                <label for="cardName"
                                    class="outline-label position-absolute top-0 start-0 translate-middle-y bg-white px-1 ms-3 text-muted">Cardholder`s
                                    Name</label>
                            </div>


                            <div class="row g-2 mt-2">

                                <div class="position-relative col-6">
                                    <input type="text" class="form-control py-2" id="cardNumber"
                                        placeholder="1234 5678 1234 5678">
                                    <label for="cardNumber"
                                        class="outline-label position-absolute top-0 start-0 translate-middle-y bg-white px-1 ms-3 text-muted">Card
                                        Number</label>
                                </div>

                                <div class="position-relative col-3 ">
                                    <input type="text" class="form-control text-center py-2" id="Expire"
                                        placeholder="MM/YY" maxlength="5" pattern="(0[1-9]|1[0-2])/([0-9]{2})">
                                    <label for="Expire"
                                        class="outline-label position-absolute top-0 start-0 translate-middle-y bg-white px-1 ms-3 text-muted">Expire</label>
                                </div>

                                <div class="position-relative col-3  ">
                                    <input type="password" class="form-control py-2" id="Cvv" placeholder="***"
                                        maxlength="3">
                                    <label for="Cvv"
                                        class="outline-label position-absolute top-0 start-0 translate-middle-y bg-white px-1 ms-3 text-muted">Cvv</label>
                                </div>
                            </div>
                        </div>

                        <button type="button" class="btn btn-success col-12 mt-3 ADDCARD ">ADD CARD</button>

                    </div>

                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
